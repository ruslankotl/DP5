[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DP5"
version = "0.1.2"
requires-python = ">=3.9, <=3.12"
description = "A short description of the project"
readme = "readme.md"
authors = [
    {name = "Kristaps Ermanis"},
    {name = "Alexander Howarth"}
]
maintainers = [
    {name = "Ruslan Kotlyarov", email = "rk582@cam.ac.uk"}
]

dependencies = [
        "tomli",
        "numpy<2",
        "rdkit",
        "lmfit",
        "matplotlib",
        "scipy>=1.10",
        "nmrglue",
        "tqdm",
        "scikit-learn",
        "pathos",
        "pandas",
        "statsmodels",
        "h5py>=3.16,<4",
        "torch>=2.14,<3",
        "torch-geometric>=2.8,<3",
        "dill",
        "joblib",
        "networkx>=3"

    ]

[project.optional-dependencies]
dev = [
    "sphinx==7.4.7",
    "sphinx-rtd-theme==2.0",
]

[project.urls]
Documentation = "https://ruslankotl.github.io/DP5/index.html"
Source = "https://github.com/ruslankotl/DP5"



[project.scripts]
pydp4 = "dp5.load_config:main"

[tool.setuptools.packages.find]
include = ["dp5"]
